services:
  # --- SHARED INFRASTRUCTURE ---
  postgres:
    image: postgres:15-alpine
    container_name: finledger-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finledger_db
    ports:
      - "5432:5432"
    volumes:
      - finledger_postgres_data:/var/lib/postgresql/data
    networks:
      - finledger-net

  redis:
    image: redis:alpine
    container_name: finledger-redis
    ports:
      - "6379:6379"
    networks:
      - finledger-net

  # --- SERVER 1 ---
  app1:
    build: .
    container_name: finledger-app-1
    depends_on:
      - postgres
      - redis
    environment: &app_env  # <--- Anchor (Define reusable config)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finledger_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
      # --- Database schema management (Flyway) ---
      # Flyway applies db/migration; Hibernate only validates that its entity
      # mapping still matches. For an existing dev database, baseline-on-migrate
      # marks the pre-Flyway schema as V1 and future migrations apply on top.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      # --- JWT (REQUIRED) ---
      # Copy .env.example to .env and set JWT_SECRET (base64, >= 64 bytes / 512 bits for HS512):
      #   openssl rand -base64 64
      SPRING_APP_JWTSECRET: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set it.}
      SPRING_APP_JWTEXPIRATIONMS: ${JWT_EXPIRATION_MS:-3600000}
      SPRING_APP_JWTCOOKIENAME: ${JWT_COOKIE_NAME:-FinLedger}
      # --- Cookie hardening (env-overridable) ---
      SPRING_APP_JWTCOOKIEPATH: /api
      SPRING_APP_JWTCOOKIEHTTPONLY: ${JWT_COOKIE_HTTPONLY:-true}
      # Secure must be true when served over HTTPS (set JWT_COOKIE_SECURE=true).
      SPRING_APP_JWTCOOKIESECURE: ${JWT_COOKIE_SECURE:-false}
      SPRING_APP_JWTCOOKIESAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      # --- CORS (comma-separated allowlist; frontend origin) ---
      SPRING_APP_ALLOWEDORIGINS: ${FRONTEND_ORIGIN:-http://localhost:5173}
    networks:
      - finledger-net

  # --- SERVER 2 (The Twin) ---
  app2:
    build: .
    container_name: finledger-app-2
    depends_on:
      - postgres
      - redis
    environment: *app_env  # <--- Alias (Reuse config from app1)
    networks:
      - finledger-net

  # --- THE LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    container_name: finledger-nginx
    ports:
      - "80:80"  # <--- Expose standard web port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount our config file
    depends_on:
      - app1
      - app2
    networks:
      - finledger-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: finledger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - finledger-net

networks:
  finledger-net:
    driver: bridge

volumes:
  finledger_postgres_data:
