services:
  # --- SHARED INFRASTRUCTURE ---
  postgres:
    image: postgres:15-alpine
    container_name: finledger-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finledger_db
    ports:
      - "5432:5432"
    volumes:
      - finledger_postgres_data:/var/lib/postgresql/data
    networks:
      - finledger-net

  redis:
    image: redis:alpine
    container_name: finledger-redis
    ports:
      - "6379:6379"
    networks:
      - finledger-net

  # --- SERVER 1 ---
  app1:
    build: .
    container_name: finledger-app-1
    depends_on:
      - postgres
      - redis
    environment: &app_env  # <--- Anchor (Define reusable config)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finledger_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
      # Schema is managed by Hibernate (matches application.properties.example). No Flyway.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # JWT — developer defaults for the local stack. Override in production.
      SPRING_APP_JWTSECRET: Omuw5HWMivL2oR8nDDPoCfy66ENRUGzeKlqPJZ+cUxlFNL99r69GfESL1IkQdy+rvaH1cPB+HETr/VMTjuiSMQ==
      SPRING_APP_JWTEXPIRATIONMS: 3600000
      SPRING_APP_JWTCOOKIENAME: FinLedger
    networks:
      - finledger-net

  # --- SERVER 2 (The Twin) ---
  app2:
    build: .
    container_name: finledger-app-2
    depends_on:
      - postgres
      - redis
    environment: *app_env  # <--- Alias (Reuse config from app1)
    networks:
      - finledger-net

  # --- THE LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    container_name: finledger-nginx
    ports:
      - "80:80"  # <--- Expose standard web port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount our config file
    depends_on:
      - app1
      - app2
    networks:
      - finledger-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: finledger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - finledger-net

networks:
  finledger-net:
    driver: bridge

volumes:
  finledger_postgres_data:
